<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>区域选择器 · 简化版 · Avoid The Pit</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.0.0/tabler-icons.min.css">
<style>
body {
  font-family: 'PingFang SC', 'Noto Sans SC', sans-serif;
  background: #F5F1EA;
  margin: 0; padding: 20px;
  display: flex; justify-content: center;
}
.frame { max-width: 380px; width: 100%; background: #FFFEFB; border-radius: 22px; overflow: hidden; border: 0.5px solid rgba(0,0,0,0.12); }
.status-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 18px 4px; font-size: 12px; color: #1A1A1A; font-weight: 500; }
.header { display: flex; justify-content: space-between; align-items: center; padding: 8px 16px; }
.btn-primary { background: #FF2C55; color: white; border: none; padding: 12px; border-radius: 8px; font-size: 14px; font-weight: 500; width: 100%; cursor: pointer; }
.btn-dark { background: #1A1A1A; color: white; border: none; padding: 9px; border-radius: 6px; font-size: 12px; font-weight: 500; cursor: pointer; }
.btn-outline { background: transparent; color: #1A1A1A; border: 0.5px solid rgba(0,0,0,0.15); padding: 9px 14px; border-radius: 6px; font-size: 12px; cursor: pointer; }
.detect-card { margin: 14px; padding: 14px; background: #FBF5E8; border: 0.5px solid #E6CB89; border-radius: 10px; }
.province-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; padding: 0 16px; }
.province-tile { padding: 12px; border-radius: 10px; }
.province-tile.selected { background: #1A1A1A; color: white; }
.province-tile.unselected { background: #FAF6EE; color: #1A1A1A; border: 0.5px solid rgba(0,0,0,0.04); }
.label { font-size: 11px; color: #8C8C8C; letter-spacing: 0.3px; }
</style>
</head>
<body>
<div class="frame">
  <div class="status-bar"><span>9:41</span><span><i class="ti ti-signal-4g"></i> <i class="ti ti-wifi"></i> <i class="ti ti-battery-3"></i></span></div>
  <div class="header">
    <div style="display: flex; align-items: center; gap: 10px;">
      <i class="ti ti-chevron-left" style="font-size: 22px;"></i>
      <span style="font-size: 16px; font-weight: 500;">关心哪里</span>
    </div>
    <span style="font-size: 13px; color: #FF2C55; font-weight: 500;">保存</span>
  </div>
  <div style="padding: 0 16px 6px; font-size: 11px; color: #8C8C8C; line-height: 1.55;">按你所在的<b>省 / 州</b>推荐内容。同一省内信息基本一致,不用再分城市。</div>

  <div class="detect-card">
    <div style="display: flex; gap: 10px;">
      <div style="width: 30px; height: 30px; border-radius: 50%; background: #C9A356; display: flex; align-items: center; justify-content: center;"><i class="ti ti-map-pin-filled" style="color: white;"></i></div>
      <div style="flex: 1;">
        <div style="font-size: 12px; color: #856C32;">检测到你在</div>
        <div style="font-size: 15px; font-weight: 500;">BC · 不列颠哥伦比亚</div>
        <div style="font-size: 10px; color: #8C7849; margin: 4px 0 10px;">附近城市:列治文 · 用于地图距离计算,不用单独选</div>
        <div style="display: flex; gap: 6px;">
          <button class="btn-dark" style="flex: 1;">就用 BC</button>
          <button class="btn-outline">选别的省</button>
        </div>
      </div>
    </div>
  </div>

  <div style="padding: 14px 16px 6px;">
    <div class="label" style="margin-bottom: 10px;">加拿大 · 按省选</div>
    <div class="province-grid">
      <div class="province-tile selected">
        <div style="display: flex; align-items: center; gap: 6px;"><span style="font-size: 16px; font-weight: 500;">BC</span><i class="ti ti-circle-check-filled" style="color: #C9A356; margin-left: auto;"></i></div>
        <div style="font-size: 10px; opacity: 0.7; margin: 4px 0 6px;">不列颠哥伦比亚</div>
        <div style="font-size: 9px; opacity: 0.55;">大温 · 温哥华 · 列治文 · 维多利亚</div>
        <div style="margin-top: 8px; padding-top: 6px; border-top: 0.5px solid rgba(255,255,255,0.15); display: flex; gap: 8px;"><span style="font-size: 9px; color: #C9A356;">8.4k 活跃</span></div>
      </div>
      <div class="province-tile unselected">
        <div style="font-size: 16px; font-weight: 500;">ON</div>
        <div style="font-size: 10px; color: #8C8C8C; margin: 4px 0 6px;">安大略</div>
        <div style="font-size: 9px; color: #8C8C8C;">GTA · 多伦多 · 万锦</div>
        <div style="margin-top: 8px; padding-top: 6px; border-top: 0.5px solid rgba(0,0,0,0.06); font-size: 9px; font-weight: 500;">14.2k 活跃</div>
      </div>
      <div class="province-tile unselected">
        <div style="font-size: 16px; font-weight: 500;">AB</div>
        <div style="font-size: 10px; color: #8C8C8C; margin: 4px 0 6px;">阿尔伯塔</div>
        <div style="font-size: 9px; color: #8C8C8C;">卡尔加里 · 埃德蒙顿</div>
      </div>
      <div class="province-tile unselected">
        <div style="font-size: 16px; font-weight: 500;">QC</div>
        <div style="font-size: 10px; color: #8C8C8C; margin: 4px 0 6px;">魁北克</div>
        <div style="font-size: 9px; color: #8C8C8C;">蒙特利尔</div>
      </div>
    </div>
  </div>

  <div style="padding: 16px 14px 18px;">
    <button class="btn-primary">保存 · BC + 关注 2 省</button>
    <div style="font-size: 10px; color: #8C8C8C; text-align: center; margin-top: 8px;">本省 65% · 关注 25% · 国家 / 北美 10%</div>
  </div>
</div>

<!--
  完整源码与所有交互细节见产品 chat 历史 widget: mobile_region_picker_simplified_v2_avoidthepit
  对应 spec § 7.4
  -->
</body>
</html>
