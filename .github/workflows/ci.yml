name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: atp
          POSTGRES_DB: avoidthepit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Test
        env:
          DATABASE_URL: postgresql://postgres:atp@localhost:5432/avoidthepit_test
        run: |
          npx prisma generate
          npx prisma migrate deploy
          npm test -- --run

      - name: Build
        env:
          DATABASE_URL: postgresql://postgres:atp@localhost:5432/avoidthepit_test
        run: npm run build
